<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151d">
    <meta name="description" content="Els jocs de Quimet, en un sol lloc. Construcció, trencaclosques de lògica, números i cartes per jugar al navegador.">
    <title>Jocs del Quim</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2358e1ba'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%2310151d'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <!-- Scripts clàssics amb defer: també funcionen obrint index.html amb doble clic. -->
    <script src="jocs.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#cataleg">Salta al catàleg</a>
    <header class="site-header wrap">
      <a class="brand" href="./" aria-label="Jocs de Quimet, inici">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z"/></svg></span>
        <span>Quim - QMRCAT<span class="brand-subtitle">Jocs en català</span></span>
      </a>
      <a class="header-link" href="https://github.com/qmrcat" target="_blank" rel="noopener noreferrer">GitHub <span class="visually-hidden">(s’obre en una pestanya nova)</span></a>
    </header>
    <main class="wrap" id="cataleg">
      <div class="catalog-heading">
        <div>
          <p class="eyebrow">EL CATÀLEG</p>
          <h1>Tria el teu joc<span class="title-dot" aria-hidden="true">.</span></h1>
          <p class="intro">Construcció, lògica i cartes, a un clic.</p>
        </div>
        <p class="catalog-count" id="catalog-count" aria-live="polite"></p>
      </div>
      <div class="games-grid" id="games-grid"></div>
      <p class="catalog-note" id="catalog-note" hidden></p>
      <noscript>
        <div class="noscript-message">
          <p>Activa JavaScript per veure les fitxes. També pots accedir directament als jocs:</p>
          <ul>
            <li><a href="https://qmrcat.github.io/vila-mediterrania/">Vila Mediterrània</a></li>
            <li><a href="https://qmrcat.github.io/fletxes-lliures/">Fletxes Lliures</a></li>
            <li><a href="https://qmrcat.github.io/Parella-de-deus/">Parelles de Deu</a></li>
            <li><a href="https://qmrcat.github.io/Treu-l-embus/">Treu l’embús</a></li>
            <li><a href="https://qmrcat.github.io/Zona-Botifarra/">Zona Botifarra</a></li>
            <li><a href="https://vibracat.github.io/sudo/">Sudoku-sudo</a></li>
          </ul>
        </div>
      </noscript>
    </main>
    <footer class="site-footer wrap">
      <p>Jocs del Quim - QMRCAT</p>
      <p>Els jocs s’obren en una pestanya nova.</p>
    </footer>
  </body>
</html>
